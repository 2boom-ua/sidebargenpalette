<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Core UI Palette Generator</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div id="app">
        <div class="sidebar-header">
            <div class="color-input-group">
                <div class="color-input-row">
                    <input type="color" id="baseColorPicker" value="#82A9E8" data-tooltip-key="tooltipPickup">
                    <input type="text" id="baseColorHex" value="#82A9E8" maxlength="7">
                    <button id="pasteBtn" class="theme-btn" data-tooltip-key="tooltipPaste">
                        <img src="icons/paste.svg" alt="Paste" id="pasteIcon" class="theme-icon">
                    </button>
                    <button id="themeToggle" class="theme-btn" data-tooltip-key="tooltipToggle">
                        <img src="icons/moon.svg" alt="Toggle theme" id="themeIcon" class="theme-icon">
                    </button>
                </div>
            </div>
        </div>

        <div class="palette-list" id="paletteList">
            <!-- generated by JS -->
        </div>

        <div class="preview-section">
            <div class="preview-box" id="previewBox">
                <div class="preview-surface" id="previewSurface">
                    <div class="preview-header">
                        <p class="preview-title" id="previewTitle">Example UI</p>
                        <div class="export-buttons">
                            <button id="exportCSS" class="export-btn" data-tooltip-key="tooltipCopyCSS">CSS</button>
                            <button id="exportJSON" class="export-btn" data-tooltip-key="tooltipCopyJSON">JSON</button>
                        </div>
                    </div>
                    <div class="preview-content">
                        <div class="preview-main">
                            <button class="preview-btn" id="previewBtn">Primary Button</button>
                            <p class="preview-text" id="previewText">Main text</p>
                            <p class="preview-text-secondary" id="previewTextSecondary">Secondary text</p>
                        </div>
                        <div class="preview-semantic" id="previewSemantic">
                            <span class="semantic-item semantic-success">Success</span>
                            <span class="semantic-item semantic-warning">Warning</span>
                            <span class="semantic-item semantic-error">Error</span>
                            <span class="semantic-item semantic-info">Info</span>
                        </div>
                    </div>
                    <div class="preview-border-box" id="previewBorderBox">Surface</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span><strong>Core UI Palette</strong> Generator, &copy; 2boom, 2026.</span>
        </div>
    </div>

    <div class="toast-container" id="toastContainer">
        <div class="toast" id="toast"></div>
    </div>

    <div class="tooltip-container" id="tooltipContainer">
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
